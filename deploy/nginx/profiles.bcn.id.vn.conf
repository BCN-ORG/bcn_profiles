# profiles.bcn.id.vn — TLS terminates here; app containers bind localhost only.
# Install (server admin):
#   sudo cp /opt/apps/bcn_profiles/nginx.profiles.bcn.id.vn.conf /etc/nginx/sites-available/profiles.bcn.id.vn.conf
#   sudo ln -sf /etc/nginx/sites-available/profiles.bcn.id.vn.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ports must match GitHub Environment production:
#   BE HOST_PORT=18085  FE_HOST_PORT=18087

upstream bcn_profiles_api {
    server 127.0.0.1:18085;
    keepalive 16;
}

upstream bcn_profiles_web {
    server 127.0.0.1:18087;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name profiles.bcn.id.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name profiles.bcn.id.vn;

    # ssl_certificate     /etc/letsencrypt/live/profiles.bcn.id.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/profiles.bcn.id.vn/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 25m;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_pass http://bcn_profiles_api;
    }

    # Nest also serves OIDC discovery / JWKS under the api prefix in some setups;
    # keep well-known on the FE host routed to API when path starts with api.
    location = /.well-known/openid-configuration {
        return 301 /api/.well-known/openid-configuration;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://bcn_profiles_web;
    }
}
